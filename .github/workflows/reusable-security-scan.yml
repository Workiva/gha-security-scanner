name: Reusable Security Scanner

on:
  workflow_call:
    inputs:
      scanner:
        description: 'Static code analysis tool to use. Options: semgrep'
        required: false
        type: string
        default: semgrep
      dd-product-name:
        description: 'Product name (asset name) in DefectDojo'
        required: false
        type: string
        default: ''
      dd-engagement-name:
        description: 'Engagement name in DefectDojo'
        required: false
        type: string
        default: 'GitHub Actions'
      dd-close-old-findings:
        description: 'Close old findings in DefectDojo'
        required: false
        type: string
        default: 'true'
      dd-on-error:
        description: 'Error behaviour when DefectDojo upload fails'
        required: false
        type: string
        default: 'warn'
    secrets:
      DEFECTDOJO_URL:
        description: 'DefectDojo instance base URL'
        required: false
      DEFECTDOJO_API_KEY:
        description: 'DefectDojo API key'
        required: false
      DEFECTDOJO_ORG_NAME:
        description: 'Target organization name in DefectDojo'
        required: false

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Workiva/gha-security-scanner@master
        with:
          scanner: ${{ inputs.scanner }}
          dd-product-name: ${{ inputs.dd-product-name }}
          dd-engagement-name: ${{ inputs.dd-engagement-name }}
          dd-close-old-findings: ${{ inputs.dd-close-old-findings }}
          dd-on-error: ${{ inputs.dd-on-error }}
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ORG_NAME: ${{ secrets.DEFECTDOJO_ORG_NAME }}
