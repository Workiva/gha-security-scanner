name: Continuous Integration

on:
  push:
    branches:
      - 'master'
      - 'experiments/**/*'
      - '_integration/**/*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

permissions:
  actions: read
  contents: write
  id-token: write
  security-events: write

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: Workiva/gha-ts/setup-node@v0.1.43
        with:
          run-install: true

      - name: Run all package scripts
        run: npm run all

      - name: Compare the expected and actual dist/ directories
        id: diff
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build."
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes detected in dist/ directory.";
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push dist/ changes
        if:
          github.event_name == 'pull_request' &&
          steps.diff.outputs.changes_detected == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add dist/
          git commit -m "chore: update dist/ directory [automated]"
          git push

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: Workiva/gha-ts/setup-node@v0.1.43
        with:
          run-install: true

      - name: Create fixture that triggers detect-non-literal-regexp
        run: |
          echo 'function search(pattern) { return new RegExp(pattern).test("test"); }' > semgrep-test.js
          git add semgrep-test.js

      - name: Add exclude_rules to aviary.yaml
        run: |
          printf '\nexclude_rules:\n  - javascript.lang.security.audit.detect-non-literal-regexp\n' >> aviary.yaml

      - name: Test Local Action
        uses: ./

      - name: Confirm fixture triggers detect-non-literal-regexp without exclude
        run: |
          semgrep --config r/javascript.lang.security.audit.detect-non-literal-regexp --no-git-ignore semgrep-test.js --json > /tmp/baseline.json
          grep -q "detect-non-literal-regexp" /tmp/baseline.json || { echo "FAIL: rule does not fire on fixture — test is invalid"; exit 1; }
          echo "Baseline confirmed: rule fires on fixture without exclude"

      - name: Verify exclude_rules prevents rule from appearing in SARIF
        run: |
          count=$(jq '[.runs[0].results[] | select(.ruleId == "javascript.lang.security.audit.detect-non-literal-regexp")] | length' semgrep.sarif)
          if [ "$count" -gt 0 ]; then
            echo "FAIL: $count finding(s) for detect-non-literal-regexp in SARIF results — aviary.yaml exclude_rules did not apply"
            exit 1
          fi
          echo "PASS: no findings for detect-non-literal-regexp in SARIF results (excluded via aviary.yaml)"
