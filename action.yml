name: Security Scanner
description: Generates and uploads SARIF files to GitHub Advanced Security.
author: Workiva

inputs:
  scanner:
    description: 'Static code analysis tool to use. Options: semgrep'
    required: false
    default: semgrep

  # --- DefectDojo integration (all optional) ---
  dd-url:
    description: >
      DefectDojo instance base URL (e.g. https://defectdojo.example.com). Leave
      empty to skip DefectDojo upload entirely (default behaviour).
    required: false
    default: ''
  dd-token:
    description: >
      DefectDojo API token or key. Should be stored as a secret in Secret
      Manager and passed from secrets (e.g. secrets.DEFECTDOJO_TOKEN or
      secrets.DEFECTDOJO_API_KEY).
    required: false
    default: ''
  dd-api-key:
    description: >
      DefectDojo API key (alias for dd-token). Can also be provided via the
      DEFECTDOJO_API_KEY environment variable from Secret Manager.
    required: false
    default: ''
  dd-product-name:
    description: >
      Product name (asset name) in DefectDojo. Defaults to the GitHub repository
      name (e.g. 'xyz' for 'owner/xyz' from GITHUB_REPOSITORY).
    required: false
    default: ''
  dd-org-name:
    description: >
      Target organization name in DefectDojo (alias for dd-product-type-name).
      Can also be provided via the DEFECTDOJO_ORG_NAME environment variable from
      Secret Manager. Defaults to GITHUB_REPOSITORY_OWNER or the owner component
      of GITHUB_REPOSITORY.
    required: false
    default: ''
  dd-product-type-name:
    description: >
      Product type name (target organization) in DefectDojo. Required for
      automatic asset creation when the asset does not exist yet. Defaults to
      GITHUB_REPOSITORY_OWNER or the owner component of GITHUB_REPOSITORY.
    required: false
    default: ''
  dd-engagement-name:
    description: >
      Engagement name in DefectDojo. Defaults to 'GitHub Actions' (e.g. 'Semgrep
      CI'). All scans from this action will be grouped under the same
      engagement, allowing DefectDojo to apply close_old_findings across runs.
    required: false
    default: ''
  dd-close-old-findings:
    description: >
      When 'true' (default), findings present in a previous scan but absent from
      the current scan are marked inactive in DefectDojo. Set to 'false' to
      preserve all historical findings (recommended for PR scans that only cover
      changed files).
    required: false
    default: 'true'
  dd-on-error:
    description: >
      Behaviour when the DefectDojo upload fails. 'warn' (default) — log a
      warning; the action still succeeds and GHAS
        upload proceeds normally.
      'fail' — call setFailed(); the action exits non-zero.
    required: false
    default: 'warn'

runs:
  using: composite
  steps:
    - name: 'Set up Node'
      uses: actions/setup-node@v7
      with:
        node-version: '24.13.0'
        package-manager-cache: false
    - name: 'Generate SARIF file'
      run: node '${{ github.action_path }}/dist/index.js'
      env:
        INPUT_SCANNER: '${{ inputs.scanner }}'
        INPUT_DD_URL: '${{ inputs.dd-url }}'
        INPUT_DD_TOKEN: '${{ inputs.dd-token }}'
        INPUT_DD_API_KEY: '${{ inputs.dd-api-key }}'
        INPUT_DD_PRODUCT_NAME: '${{ inputs.dd-product-name }}'
        INPUT_DD_PRODUCT_TYPE_NAME: '${{ inputs.dd-product-type-name }}'
        INPUT_DD_ORG_NAME: '${{ inputs.dd-org-name }}'
        INPUT_DD_ENGAGEMENT_NAME: '${{ inputs.dd-engagement-name }}'
        INPUT_DD_CLOSE_OLD_FINDINGS: '${{ inputs.dd-close-old-findings }}'
        INPUT_DD_ON_ERROR: '${{ inputs.dd-on-error }}'
      shell: bash
    - name: 'Upload SARIF file to GitHub Advanced Security'
      id: upload
      uses: github/codeql-action/upload-sarif@v4.38.2
      with:
        sarif_file: semgrep.sarif
    - name: 'Dismiss suppressed finding alerts'
      uses: advanced-security/dismiss-alerts@v2.0.3
      with:
        sarif-file: semgrep.sarif
        sarif-id: ${{ steps.upload.outputs.sarif-id }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
