name: Security Scanner
description: Generates and uploads SARIF files to GitHub Advanced Security.
author: Workiva

inputs:
  scanner:
    description: 'Static code analysis tool to use. Options: semgrep'
    required: false
    default: semgrep

  # --- DefectDojo configuration (all optional) ---
  dd-url:
    description: >
      DefectDojo instance base URL. When empty, the DefectDojo upload is
      skipped. Typically passed from the DEFECTDOJO_URL secret.
    required: false
    default: ''
  dd-api-key:
    description: >
      DefectDojo API key / token. Typically passed from the DEFECTDOJO_API_KEY
      secret.
    required: false
    default: ''
  dd-org-name:
    description: >
      Target organization (product type) name in DefectDojo. Defaults to the
      GitHub repository owner. Typically passed from the DEFECTDOJO_ORG_NAME
      secret. The asset name is always the GitHub repository name.
    required: false
    default: ''
  dd-engagement-name:
    description: >
      Engagement name in DefectDojo. Defaults to 'GitHub Actions' (e.g. 'Semgrep
      CI'). All scans from this action will be grouped under the same
      engagement, allowing DefectDojo to apply close_old_findings across runs.
    required: false
    default: ''
  dd-close-old-findings:
    description: >
      When 'true' (default), findings present in a previous scan but absent from
      the current scan are marked inactive in DefectDojo. Set to 'false' to
      preserve all historical findings.
    required: false
    default: 'true'
  dd-on-error:
    description: >
      Behaviour when the DefectDojo upload fails. 'warn' (default) — log a
      warning; the action still succeeds and GHAS upload proceeds normally.
      'fail' — call setFailed(); the action exits non-zero.
    required: false
    default: 'warn'

  # --- S3 archive configuration (all optional) ---
  s3-bucket:
    description: >
      Name of the S3 bucket (in the AWS security account) that receives the scan
      archive. When empty, the S3 archive is skipped. The action never creates
      the bucket and never sets any retention/lifecycle/object-lock policy.
    required: false
    default: ''
  s3-role-arn:
    description: >
      ARN of the IAM role assumed via GitHub OIDC to write to the bucket. The
      calling workflow must grant 'id-token: write'. When empty, the S3 archive
      is skipped.
    required: false
    default: ''
  s3-region:
    description: AWS region of the bucket.
    required: false
    default: 'us-east-1'
  s3-prefix:
    description: >
      Key prefix inside the bucket. Objects are written to
      '<prefix>/<owner>/<repo>/<YYYY>/<MM>/<DD>/<run_id>-<run_attempt>/'.
    required: false
    default: 'semgrep'
  s3-on-error:
    description: >
      Behaviour when the S3 archive fails. 'warn' (default) — log a warning and
      continue. 'fail' — the action exits non-zero.
    required: false
    default: 'warn'

runs:
  using: composite
  steps:
    - name: 'Set up Node'
      uses: actions/setup-node@v7
      with:
        node-version: '24.13.0'
        package-manager-cache: false
    - name: 'Generate SARIF file'
      run: node '${{ github.action_path }}/dist/index.js'
      env:
        INPUT_SCANNER: '${{ inputs.scanner }}'
      shell: bash
    - name: 'Upload SARIF file to GitHub Advanced Security'
      id: upload
      uses: github/codeql-action/upload-sarif@v4.39.1
      with:
        sarif_file: semgrep.sarif
    - name: 'Dismiss suppressed finding alerts'
      uses: advanced-security/dismiss-alerts@v2.0.3
      with:
        sarif-file: semgrep.sarif
        sarif-id: ${{ steps.upload.outputs.sarif-id }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: 'Upload scan results to DefectDojo'
      if: github.event_name == 'schedule'
      run: node '${{ github.action_path }}/dist/defectdojo.js'
      env:
        INPUT_DD-URL: '${{ inputs.dd-url }}'
        INPUT_DD-API-KEY: '${{ inputs.dd-api-key }}'
        INPUT_DD-ORG-NAME: '${{ inputs.dd-org-name }}'
        INPUT_DD-ENGAGEMENT-NAME: '${{ inputs.dd-engagement-name }}'
        INPUT_DD-CLOSE-OLD-FINDINGS: '${{ inputs.dd-close-old-findings }}'
        INPUT_DD-ON-ERROR: '${{ inputs.dd-on-error }}'
      shell: bash
    - name: 'Create scan archive'
      id: archive
      if: >-
        !cancelled() && github.event_name == 'schedule' && inputs.s3-bucket !=
        '' && inputs.s3-role-arn != ''
      continue-on-error: ${{ inputs.s3-on-error != 'fail' }}
      env:
        S3_PREFIX: '${{ inputs.s3-prefix }}'
      run: |
        set -euo pipefail
        files=()
        for f in semgrep.sarif semgrep.json; do
          [ -f "$f" ] && files+=("$f")
        done
        if [ "${#files[@]}" -eq 0 ]; then
          echo "::warning::No semgrep output files found; skipping S3 archive."
          echo "created=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        prefix="${S3_PREFIX%/}"
        day="$(date -u +%Y/%m/%d)"
        key="${prefix}/${GITHUB_REPOSITORY}/${day}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/semgrep-${GITHUB_SHA}.tar.gz"
        archive="${RUNNER_TEMP}/semgrep-archive.tar.gz"
        tar -czf "$archive" "${files[@]}"
        {
          echo "created=true"
          echo "archive=$archive"
          echo "key=$key"
        } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Configure AWS credentials (OIDC)'
      id: aws-creds
      if: steps.archive.outputs.created == 'true'
      continue-on-error: ${{ inputs.s3-on-error != 'fail' }}
      uses: aws-actions/configure-aws-credentials@v5.0.0
      with:
        role-to-assume: ${{ inputs.s3-role-arn }}
        aws-region: ${{ inputs.s3-region }}
        role-session-name: gha-security-scanner
    - name: 'Upload scan archive to S3'
      if:
        steps.archive.outputs.created == 'true' && steps.aws-creds.outcome ==
        'success'
      continue-on-error: ${{ inputs.s3-on-error != 'fail' }}
      env:
        S3_BUCKET: '${{ inputs.s3-bucket }}'
        ARCHIVE: '${{ steps.archive.outputs.archive }}'
        KEY: '${{ steps.archive.outputs.key }}'
      run: |
        set -euo pipefail
        aws s3 cp "$ARCHIVE" "s3://${S3_BUCKET}/${KEY}" \
          --only-show-errors \
          --sse AES256 \
          --metadata "repository=${GITHUB_REPOSITORY},sha=${GITHUB_SHA},run-id=${GITHUB_RUN_ID},ref=${GITHUB_REF_NAME}"
        echo "Archived scan results to s3://${S3_BUCKET}/${KEY}"
      shell: bash
